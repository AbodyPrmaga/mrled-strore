{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" href="{% static 'images/icon.png' %}">

    <title>{{ product.name }}</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --orange: #FF7A00;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f5f5;
        }

        .icon {
            width: clamp(50px, 10vw, 80px);
            height: auto;
        }
    </style>
</head>

<body>
    <!-- WhatsApp Floating Button -->
<a href="https://wa.me/201020493855"
   class="whatsapp-btn"
   target="_blank">
    <i class="fab fa-whatsapp"></i>
    <span class="whatsapp-text">ازاي اقدر اساعدك؟</span>
</a>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
.whatsapp-btn{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    background:#25D366;
    color:#fff;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:32px;
    z-index:9999;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    transition:.3s;
}

.whatsapp-btn:hover{
    width:230px;
    border-radius:50px;
}

.whatsapp-text{
    white-space:nowrap;
    max-width:0;
    overflow:hidden;
    transition:.3s;
    font-size:16px;
    margin-right:10px;
    font-weight:600;
}

.whatsapp-btn:hover .whatsapp-text{
    max-width:180px;
}
</style>
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="h-16 sm:h-20 flex items-center justify-between gap-4">

                <!-- زر السلة (الشمال) -->
                <div class="flex items-center shrink-0">
                    <a href="{% url 'cart' %}" class="flex items-center gap-1 sm:gap-2 font-semibold text-sm sm:text-base">
                        🛒 <span class="hidden sm:inline">السلة</span>
                    </a>
                </div>

                <!-- المنتصف (النافيجيشن) -->
                <nav class="hidden md:flex items-center gap-4 lg:gap-10 font-semibold text-sm lg:text-base">
                    <a href="{%url 'home'%}">الرئيسية</a>
                    <a href="https://wa.me/201020493855" target="_blank">تواصل معنا</a>
                    <a href="{%url 'products'%}">تسوق</a>
                </nav>

                <!-- اليمين (الأيقونة) -->
                <div class="flex items-center gap-2 shrink-0">
                    <img class="icon" src="{% static 'images/icon.png' %}" alt="icon">
                </div>

            </div>
        </div>
    </header>
    <div class="max-w-7xl mx-auto p-4 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-10">

        <!-- IMAGE -->
        <div>
            <img src="{{ product.image.url }}" class="w-full rounded-2xl shadow-lg">
        </div>

        <!-- INFO -->
        <div class="bg-white p-5 sm:p-6 rounded-2xl">

            <h1 class="text-2xl sm:text-3xl font-black mb-3 sm:mb-4">{{ product.name }}</h1>

            <p class="text-xl sm:text-2xl text-[var(--orange)] font-bold mb-3 sm:mb-4">
                {{ product.price }} ج.م
            </p>

            <p class="text-gray-600 mb-5 sm:mb-6 leading-loose text-sm sm:text-base">
                {{ product.description }}
            </p>

            <!-- 🛒 FORM ADD TO CART -->
            <form method="POST" action="{% url 'add_to_cart' product.id %}" class="space-y-4">

                {% csrf_token %}

                <!-- quantity selector -->
                <div>
                    <label class="block mb-2 font-bold text-sm sm:text-base">الكمية</label>
                    <input type="number" name="quantity" value="1" min="1" class="w-full p-2.5 sm:p-3 border rounded-xl text-sm sm:text-base">
                </div>

                <!-- add to cart -->
                <button type="submit" class="w-full bg-[var(--orange)] text-white px-5 sm:px-6 py-2.5 sm:py-3 rounded-full font-bold text-sm sm:text-base">
                    إضافة إلى السلة 🛒
                </button>

            </form>

            <!-- go cart -->
            <a href="{% url 'cart' %}"
                class="block text-center border border-gray-300 text-gray-700 px-5 sm:px-6 py-2.5 sm:py-3 rounded-full mt-4 text-sm sm:text-base">
                الذهاب إلى السلة
            </a>

            <p class="text-xs sm:text-sm text-gray-500 mt-4">
                يمكنك تعديل الكمية قبل الإضافة
            </p>

        </div>

    </div>

</body>

</html>
