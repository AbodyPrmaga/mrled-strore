<!DOCTYPE html>

<head>

<body class="bg-gray-100">

<style>
.whatsapp-btn{

    bottom:20px;

    color:#fff;
    border-radius:50%;
    display:flex;

.whatsapp-btn:hover .whatsapp-text{
