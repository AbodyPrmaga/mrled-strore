{%load static%}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Checkout</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --orange: #FF7A00;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #f5f5f5;
        }

        .icon {
            width: 150px;
            height: 150px;
        }
    </style>
</head>

<body>
    <header class="bg-white sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6">
            <div class="h-20 flex items-center justify-between relative">

                <!-- زر السلة (الشمال) -->
                <div class="flex items-center">
                    <a href="{% url 'cart' %}" class="flex items-center gap-2 font-semibold">
                        🛒 <span>السلة</span>
                    </a>
                </div>

                <!-- المنتصف (النافيجيشن) -->
                <nav class="hidden lg:flex items-center gap-10 font-semibold">
                    <a href="{%url 'home'%}">الرئيسية</a>
                    <a href="https://wa.me/201020493855" target="_blank">تواصل معنا</a>
                    <a href="{%url 'products'%}">تسوق</a>
                </nav>

                <!-- اليمين (الأيقونة) -->
                <div class="flex items-center gap-3">
                    <img class="icon" src="{% static 'images/icon.png' %}" alt="icon">
                </div>

            </div>
        </div>
    </header>

    <div class="max-w-5xl mx-auto p-6">

        <h1 class="text-3xl font-black mb-6">💳 إتمام الطلب</h1>

        <form method="POST" class="space-y-6 bg-white p-6 rounded-2xl shadow">
            {% csrf_token %}

            <!-- NAME -->
            <div>
                <label class="font-bold">اسمك بالكامل</label>
                <input type="text" name="name" required class="w-full p-3 border rounded-xl mt-2">
            </div>

            <!-- PHONE 1 -->
            <div>
                <label class="font-bold">رقم هاتف أساسي</label>
                <input type="text" name="phone" required class="w-full p-3 border rounded-xl mt-2">
            </div>

            <!-- PHONE 2 -->
            <div>
                <label class="font-bold">رقم هاتف بديل</label>
                <input type="text" name="phone2" class="w-full p-3 border rounded-xl mt-2">
            </div>

            <!-- CITY -->
            <div>
                <label class="font-bold">المدينة</label>
                <input type="text" name="city" value="المنيا" class="w-full p-3 border rounded-xl mt-2">
            </div>

            <!-- ADDRESS -->
            <div>
                <label class="font-bold">العنوان بالتفصيل</label>
                <textarea name="address" required class="w-full p-3 border rounded-xl mt-2"></textarea>
            </div>

            <!-- SHIPPING -->
            <div class="bg-gray-100 p-4 rounded-xl flex justify-between">
                <span class="font-bold">تكلفة الشحن</span>
                <span class="text-[var(--orange)] font-black">{{shipping_cost}} ج.م</span>
            </div>

            <!-- PAYMENT METHOD -->
            <div>
                <label class="font-bold mb-2 block">اختر وسيلة الدفع</label>

                <select name="payment_method" class="w-full p-3 border rounded-xl">
                    <option value="cod">دفع عند الاستلام</option>
                </select>
            </div>

            <!-- ORDER SUMMARY -->
            <div class="bg-gray-100 p-4 rounded-xl">

                <div class="flex justify-between mb-2">
                    <span>إجمالي المنتجات</span>
                    <span class="font-bold">
                        {{ subtotal }} ج.م
                    </span>
                </div>

                <div class="flex justify-between mb-2">
                    <span>الشحن</span>
                    <span class="font-bold">
                        {{ shipping_cost }} ج.م
                    </span>
                </div>

                <hr class="my-2">

                <div class="flex justify-between text-xl">
                    <span class="font-black">الإجمالي الكلي</span>
                    <span class="text-[var(--orange)] font-black">
                        {{ total }} ج.م
                    </span>
                </div>

            </div>

            <!-- SUBMIT -->
            <button type="submit" class="w-full bg-[var(--orange)] text-white py-3 rounded-full font-bold text-lg">
                تأكيد الطلب
            </button>

        </form>

    </div>

</body>

</html>
