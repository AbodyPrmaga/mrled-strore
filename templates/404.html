{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'images/icon.png' %}">
    <title>404 | الصفحة غير موجودة</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --black: #111111;
            --orange: #FF7A00;
            --orange-light: #FFA63D;
            --white: #FFFFFF;
            --gray: #F5F5F5;
        }

        body {
            background: var(--gray);
            color: var(--black);
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

    <div class="text-center max-w-2xl px-4 sm:px-6">

        <!-- رقم الخطأ -->
        <h1 class="text-7xl sm:text-9xl font-black text-[var(--orange)] mb-3 sm:mb-4">
            404
        </h1>

        <!-- رسالة -->
        <h2 class="text-2xl sm:text-3xl font-bold mb-3 sm:mb-4">
            الصفحة غير موجودة
        </h2>

        <p class="text-zinc-600 text-base sm:text-lg mb-8 sm:mb-10">
            يبدو أن الرابط الذي تحاول الوصول إليه غير صحيح أو تم حذف الصفحة.
        </p>

        <!-- زر الرجوع -->
        <a href="/" class="bg-[var(--orange)] text-white px-6 sm:px-8 py-3 sm:py-4 rounded-full font-bold
                   hover:opacity-90 hover:scale-105 transition inline-block text-sm sm:text-base">
            العودة للرئيسية
        </a>

        <!-- ديكور بسيط -->
        <div class="absolute top-20 left-20 w-72 h-72 bg-orange-500/10 blur-3xl rounded-full -z-10"></div>
        <div class="absolute bottom-10 right-10 w-80 h-80 bg-black/5 blur-3xl rounded-full -z-10"></div>

    </div>

</body>

</html>
